<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Family Trivia Night</title>
<style>
  :root {
    --ink: #1b2431;        /* deep slate night */
    --ink-soft: #2a3547;
    --paper: #f6f2e8;      /* card stock */
    --gold: #e8b23a;       /* game-show marquee gold */
    --gold-deep: #b8860b;
    --accent: #5aa9a3;     /* teal counter chip */
    --muted: #8b93a3;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    min-height: 100vh;
    background: var(--ink);
    background-image: radial-gradient(ellipse 80% 60% at 50% -10%, #2e3c55 0%, var(--ink) 65%);
    font-family: Georgia, 'Times New Roman', serif;
    color: var(--paper);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 2rem 1.5rem;
  }

  .marquee {
    font-family: 'Trebuchet MS', Verdana, sans-serif;
    font-size: 0.75rem;
    letter-spacing: 0.35em;
    text-transform: uppercase;
    color: var(--gold);
    margin-bottom: 2.5rem;
    text-align: center;
  }
  .marquee::before, .marquee::after { content: "✦"; margin: 0 0.75em; opacity: 0.6; }

  .card {
    width: 100%;
    max-width: 640px;
    background: var(--paper);
    color: var(--ink);
    border-radius: 14px;
    padding: 3rem 2.5rem 2.5rem;
    box-shadow: 0 20px 60px rgba(0,0,0,0.45), 0 0 0 6px rgba(232,178,58,0.18);
    text-align: center;
  }

  .counter-row {
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 0.6rem;
    margin-bottom: 2rem;
    flex-wrap: wrap;
  }

  .counter, .timer {
    display: inline-block;
    font-family: 'Trebuchet MS', Verdana, sans-serif;
    font-size: 0.8rem;
    font-weight: bold;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--paper);
    padding: 0.4em 1.1em;
    border-radius: 999px;
  }
  .counter { background: var(--accent); }
  .timer { background: var(--ink-soft); color: var(--gold); display: none; }
  .timer.low { background: #a3423e; color: var(--paper); }

  .question {
    font-size: clamp(1.8rem, 6vw, 3.2rem);
    line-height: 1.15;
    font-weight: bold;
    margin-bottom: 1.5rem;
    min-height: 1.2em;
    white-space: pre-line;
  }

  .choices {
    display: none;
    flex-direction: column;
    gap: 0.6rem;
    margin-bottom: 1.5rem;
    text-align: left;
    font-family: 'Trebuchet MS', Verdana, sans-serif;
  }
  .choices.visible { display: flex; }

  .category {
    display: none;
    font-family: 'Trebuchet MS', Verdana, sans-serif;
    font-size: 1.1rem;
    font-weight: bold;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: var(--gold-deep);
    margin: -1rem 0 2rem;
  }
  .category.visible { display: block; }

  .chat {
    display: none;
    width: 280px;
    margin: 0 auto 1.5rem;
    padding: 14px 12px;
    background: #fff;
    border: 1px solid #d9d4c5;
    border-radius: 22px;
    text-align: left;
    font-family: -apple-system, 'Segoe UI', 'Helvetica Neue', sans-serif;
    flex-direction: column;
    gap: 6px;
  }
  .chat.visible { display: flex; }
  .chat-header {
    text-align: center;
    font-size: 0.7rem;
    color: #8b93a3;
    margin-bottom: 4px;
  }
  .bubble {
    max-width: 75%;
    padding: 8px 12px;
    font-size: 1rem;
    line-height: 1.3;
    color: var(--ink);
  }
  .bubble.them {
    align-self: flex-start;
    background: #e9e9eb;
    border-radius: 18px 18px 18px 4px;
  }
  .bubble.me {
    align-self: flex-end;
    background: #2f9bfa;
    color: #fff;
    border-radius: 18px 18px 4px 18px;
  }
  .bubble.big-emoji {
    font-size: 2.5rem;
    line-height: 1;
    padding: 10px 14px;
  }
  .photo {
    display: none;
    max-width: 100%;
    max-height: 45vh;
    margin: 0 auto 1.5rem;
    border-radius: 10px;
    box-shadow: 0 6px 20px rgba(0,0,0,0.25);
  }
  .photo.visible { display: block; }

  .choice {
    font-size: 1.1rem;
    padding: 0.6em 1em;
    border-radius: 8px;
    background: var(--ink-soft);
    color: var(--paper);
  }

  .next-btn {
    font-family: 'Trebuchet MS', Verdana, sans-serif;
    font-size: 1.05rem;
    font-weight: bold;
    letter-spacing: 0.06em;
    color: var(--ink);
    background: var(--gold);
    border: none;
    border-bottom: 4px solid var(--gold-deep);
    border-radius: 10px;
    padding: 0.9em 3em;
    cursor: pointer;
    transition: transform 0.08s ease, filter 0.15s ease;
  }
  .next-btn:hover { filter: brightness(1.07); }
  .next-btn:active { transform: translateY(2px); border-bottom-width: 2px; }
  .next-btn:focus-visible { outline: 3px solid var(--accent); outline-offset: 3px; }
  .next-btn:disabled { opacity: 0.4; cursor: default; }

  @media (prefers-reduced-motion: reduce) {
    .next-btn { transition: none; }
  }
</style>
</head>
<body>

  <div class="marquee">Hugo Family Trivia Night</div>

  <div class="card">
    <div class="counter-row">
      <div class="counter" id="counter"></div>
      <div class="timer" id="timer"></div>
    </div>
    <div class="question" id="question"></div>
    <div class="category" id="category"></div>
    <div class="chat" id="chat"></div>
    <img class="photo" id="photo" alt="">

    <div class="choices" id="choices"></div>
    <button class="next-btn" id="startBtn" style="display: none;">Start</button>
    <button class="next-btn" id="nextBtn">Next Question</button>
  </div>

<script>
  // ------------------------------------------------------------
  // QUESTION SET — edit this array only. Everything else adapts.
  //
  // Each question is an object:
  //   id         (number, required)  stable identifier used in the URL
  //              hash (#q<id>); must be unique. Categorized questions use
  //              a <category-id>xx scheme (e.g. 200 = divider, 201-299 =
  //              its questions); everything else keeps its original id.
  //   text       (string, required)  the question as displayed
  //   type       ("short-answer" | "multiple-choice" | "true-false")
  //              defaults to "short-answer" if omitted
  //   choices    (string[])          shown only for multiple-choice /
  //              true-false; omit for short-answer
  //   answer     (string)            correct answer, host-only — never
  //              rendered on this screen, kept for the admin/answer key
  //   timeLimit  (number seconds | null)  countdown shown to players;
  //              null/omitted = no timer
  //   points     (number)            defaults to 10 if omitted
  //   category   (string)            topic label; shown as a chip on the
  //              "Ready?" screen for reveal questions
  //   reveal     (boolean)           hide the question behind a Start
  //              button; clicking it reveals the question and starts
  //              the timer
  //   chat       ({title, messages: [{from: "them"|"me",
  //              text, bigEmoji?}]})  optional iMessage-style mockup
  //              rendered below the question text
  //   image      (string)             optional image path/URL shown
  //              below the question text
  //   divider    (boolean)           category-break slide — shows only
  //              the category name and a Next button; all other fields
  //              on this object are ignored except `category`
  //   textSize   ("small" | "medium" | "large")  overrides the question
  //              font size; use "small" for long/wordy text. Defaults to
  //              "large", or "medium" when a chat mockup or choices share
  //              the card.
  //
  // This array is mirrored in trivia-answers.json for the admin view.
  // Keep the two in sync when you add/edit/remove questions.
  // ------------------------------------------------------------
  const questions = [
    {
      id: 1,
      text: "1 + 1",
      type: "short-answer",
      answer: "2",
      timeLimit: null,
      points: 0
    },
    {
      id: 200,
      divider: true,
      category: "Who Said This?"
    },
    {
      id: 201,
      text: "Do you ever feel like a computer and you just need to restart?",
      type: "short-answer",
      answer: "David",
      timeLimit: null,
      points: 10
    },
    {
      id: 202,
      text: "As the temptation to worry begins to surface, I once again remind myself of how all our needs have been met from the first day my papa had come live with us",
      type: "short-answer",
      answer: "Mom",
      timeLimit: null,
      points: 10,
      textSize: "small"
    },
    {
      id: 203,
      text: "This is she",
      type: "short-answer",
      answer: "Dad",
      timeLimit: null,
      points: 10
    },
    {
      id: 204,
      text: "Should you feel an urge too strong... saran wrap your entire torso from your knees up into your nips in addition to any standard protection you normally use.",
      type: "short-answer",
      answer: "Philip",
      timeLimit: null,
      points: 10,
      textSize: "small"
    },
    {
      id: 205,
      text: "And so the lion fell in love with the lamb.",
      type: "short-answer",
      answer: "Edward Cullen, Twilight",
      timeLimit: null,
      points: 10
    },
    {
      id: 206,
      text: "What a surprise that a woman started drama lol",
      type: "short-answer",
      answer: "David",
      timeLimit: null,
      points: 10
    },
    {
      id: 300,
      divider: true,
      category: "Movie/TV Quotes"
    },
    {
      id: 301,
      text: "I will eviscerate you in fiction. Every pimple, every character flaw. I was naked for a day; you will be naked for eternity.",
      type: "short-answer",
      answer: "Chaucer, A Knight's Tale",
      timeLimit: null,
      points: 10,
      textSize: "small"
    },
    {
      id: 302,
      text: "Biscuits and Gravey!",
      type: "short-answer",
      answer: "Bluey",
      timeLimit: null,
      points: 10
    },
    {
      id: 303,
      text: "Give me one reason — one good reason — why we should spend our last two hours in Florida looking at the sisters of Freckle-Face Haynes, the Dog-Faced Boy.",
      type: "short-answer",
      answer: "Phil Davis, White Christmas",
      timeLimit: null,
      points: 10,
      textSize: "small"
    },
    {
      id: 304,
      text: "\"Upset? I'm house broken.\"\n\"Not house broken. He means heart broken.\"",
      type: "short-answer",
      answer: "March of the Wooden Soldiers",
      timeLimit: null,
      points: 10,
      textSize: "small"
    },
    {
      id: 5,
      text: "Who's most likely sending this exchange in the family chat?",
      type: "short-answer",
      answer: "David and Victoria",
      timeLimit: null,
      points: 10,
      chat: {
        title: "Hugo Family • iMessage",
        messages: [
          { from: "them", text: "Lmao!!" },
          { from: "me", text: "🖕", bigEmoji: true },
        ]
      }
    },
    {
      id: 6,
      text: "Which player did not play in the 2000 Subway Series?",
      type: "multiple-choice",
      choices: [
        "Derek Jeter",
        "Mike Mussina",
        "Mike Piazza",
        "Paul O'Neill",
        "Al Leiter",
        "Tino Martinez",
      ],
      answer: "Mike Mussina",
      timeLimit: null,
      points: 10
    },
    {
      id: 7,
      text: "DeMarini, Easton, Kraken, Lizard Skins — these are all companies that sell what?",
      type: "short-answer",
      answer: "Softball bats (and gear)",
      timeLimit: null,
      points: 10
    },
    {
      id: 8,
      text: "How many cousins are older than Sophia?",
      type: "short-answer",
      category: "Cousins",
      answer: "10",
      timeLimit: 10,
      points: 10,
      reveal: true
    },
    {
      id: 400,
      divider: true,
      category: "Professions"
    },
    {
      id: 401,
      text: "Which of these is not an LLM?",
      type: "multiple-choice",
      choices: [
        "Claude",
        "Gemini",
        "Llama",
        "Perplexity",
      ],
      answer: "Perplexity",
      timeLimit: null,
      points: 10
    },
    {
      id: 402,
      text: "Jalousie, Casement, Awning, Double-hung — these are all a type of what?",
      type: "short-answer",
      answer: "Windows",
      timeLimit: null,
      points: 10
    },
    {
      id: 403,
      text: "What profession uses classifiers and role shifting?",
      type: "short-answer",
      answer: "Sign language interpreter",
      timeLimit: null,
      points: 10
    },
    {
      id: 404,
      text: "What is the normal human body temperature in degrees Fahrenheit?",
      type: "short-answer",
      answer: "98.6°F",
      timeLimit: null,
      points: 10
    },
    {
      id: 405,
      text: "In a blood pressure reading like 120 over 80, what does the top number measure?",
      type: "short-answer",
      answer: "Systolic pressure — the pressure when the heart beats/contracts",
      timeLimit: null,
      points: 10
    },
    {
      id: 406,
      text: "What does VPN stand for?",
      type: "short-answer",
      answer: "Virtual Private Network",
      timeLimit: null,
      points: 10
    },
    {
      id: 407,
      text: "In real estate, what does MLS stand for?",
      type: "short-answer",
      answer: "Multiple Listing Service",
      timeLimit: null,
      points: 10
    },
    {
      id: 500,
      divider: true,
      category: "Past Holidays"
    },
    {
      id: 501,
      text: "What 2 knuckleheads ruined the reading of the Christmas story with a fart prank?",
      type: "short-answer",
      answer: "Jonny and Samuel",
      timeLimit: null,
      points: 10
    },
    {
      id: 502,
      text: "What is the most expensive gift anyone has received, and who gave it?",
      type: "short-answer",
      answer: "A Onewheel, from David",
      timeLimit: null,
      points: 10
    },
    {
      id: 600,
      divider: true,
      category: "Random"
    },
    {
      id: 601,
      text: "How many houses are between this house and Dad and Mom's house?",
      type: "short-answer",
      image: "images/house.png",
      answer: "1",
      timeLimit: null,
      points: 10,
      textSize: "small"
    },
    {
      id: 602,
      text: "What was the name of David's son who got his hair caught in a tree and was killed on Joab's command?",
      type: "short-answer",
      answer: "Absalom",
      timeLimit: null,
      points: 10,
      textSize: "small"
    },
  ];

  const TEXT_SIZES = {
    small:  "clamp(1.5rem, 4vw, 3rem)",
    medium: "clamp(1.6rem, 5vw, 3.5rem)",
    large:  "clamp(2.5rem, 8vw, 4rem)",
  };

  const counterEl  = document.getElementById("counter");
  const questionEl = document.getElementById("question");
  const categoryEl = document.getElementById("category");
  const chatEl     = document.getElementById("chat");
  const photoEl    = document.getElementById("photo");
  const choicesEl  = document.getElementById("choices");
  const timerEl    = document.getElementById("timer");
  const startBtn   = document.getElementById("startBtn");
  const nextBtn    = document.getElementById("nextBtn");

  // survive an accidental refresh via URL hash (#q<id> etc.)
  const hashId = parseInt(location.hash.replace("#q", ""), 10);
  const hashIndex = questions.findIndex((q) => q.id === hashId);
  let index = hashIndex >= 0 ? hashIndex : 0;

  let timerId = null;

  function stopTimer() {
    if (timerId) { clearInterval(timerId); timerId = null; }
    timerEl.style.display = "none";
    timerEl.classList.remove("low");
  }

  function startTimer(seconds) {
    let remaining = seconds;
    timerEl.style.display = "inline-block";
    timerEl.textContent = `${remaining}s`;
    timerEl.classList.toggle("low", remaining <= 10);
    timerId = setInterval(() => {
      remaining--;
      timerEl.textContent = `${Math.max(remaining, 0)}s`;
      timerEl.classList.toggle("low", remaining <= 10);
      if (remaining <= 0) clearInterval(timerId);
    }, 1000);
  }

  let revealed = false;

  function render() {
    stopTimer();
    const q = questions[index];

    if (q.divider) {
      counterEl.textContent = "";
      startBtn.style.display = "none";
      nextBtn.style.display = "";
      questionEl.textContent = q.category;
      questionEl.style.fontSize = "";
      categoryEl.classList.remove("visible");
      chatEl.classList.remove("visible");
      photoEl.classList.remove("visible");
      choicesEl.classList.remove("visible");
      choicesEl.innerHTML = "";
      location.hash = "q" + q.id;
      nextBtn.textContent = "Start Category";
      nextBtn.disabled = false;
      return;
    }

    const hidden = q.reveal && !revealed;

    counterEl.textContent = `Question ${index + 1} of ${questions.length}`;
    startBtn.style.display = hidden ? "" : "none";
    nextBtn.style.display = hidden ? "none" : "";

    if (hidden) {
      questionEl.textContent = "Ready?";
      questionEl.style.fontSize = "";
      if (q.category) {
        categoryEl.textContent = q.category;
        categoryEl.classList.add("visible");
      } else {
        categoryEl.classList.remove("visible");
      }
      chatEl.classList.remove("visible");
      photoEl.classList.remove("visible");
      choicesEl.classList.remove("visible");
      choicesEl.innerHTML = "";
      location.hash = "q" + q.id;
      return;
    }

    questionEl.textContent = q.text;
    categoryEl.classList.remove("visible");

    if (q.image) {
      photoEl.src = q.image;
      photoEl.classList.add("visible");
    } else {
      photoEl.classList.remove("visible");
      photoEl.removeAttribute("src");
    }

    chatEl.innerHTML = "";
    if (q.chat) {
      if (q.chat.title) {
        const header = document.createElement("div");
        header.className = "chat-header";
        header.textContent = q.chat.title;
        chatEl.appendChild(header);
      }
      q.chat.messages.forEach((m) => {
        const bubble = document.createElement("div");
        bubble.className = `bubble ${m.from === "me" ? "me" : "them"}${m.bigEmoji ? " big-emoji" : ""}`;
        bubble.textContent = m.text;
        chatEl.appendChild(bubble);
      });
      chatEl.classList.add("visible");
    } else {
      chatEl.classList.remove("visible");
    }

    // shrink the question when extra content (chat mockup, choices) shares the card,
    // or when a question explicitly requests a smaller size (e.g. a long quote)
    const hasExtras = !!q.chat || !!q.image || q.type === "multiple-choice" || q.type === "true-false";
    const textSize = q.textSize || (hasExtras ? "medium" : "large");
    questionEl.style.fontSize = TEXT_SIZES[textSize] || "";

    if (q.type === "multiple-choice" || q.type === "true-false") {
      const choices = q.choices && q.choices.length ? q.choices : ["True", "False"];
      choicesEl.innerHTML = "";
      choices.forEach((choice, i) => {
        const div = document.createElement("div");
        div.className = "choice";
        div.textContent = `${String.fromCharCode(65 + i)}. ${choice}`;
        choicesEl.appendChild(div);
      });
      choicesEl.classList.add("visible");
    } else {
      choicesEl.classList.remove("visible");
      choicesEl.innerHTML = "";
    }

    if (q.timeLimit) startTimer(q.timeLimit);

    location.hash = "q" + q.id;
    if (index === questions.length - 1) {
      nextBtn.textContent = "That's the game!";
      nextBtn.disabled = true;
    } else {
      nextBtn.textContent = "Next Question";
      nextBtn.disabled = false;
    }
  }

  function next() {
    if (index < questions.length - 1) { index++; revealed = false; render(); }
  }

  function reveal() {
    revealed = true;
    render();
  }

  nextBtn.addEventListener("click", next);
  startBtn.addEventListener("click", reveal);
  document.addEventListener("keydown", (e) => {
    if (e.key === "ArrowRight" || e.key === " ") {
      e.preventDefault();
      if (questions[index].reveal && !revealed) reveal();
      else next();
    }
  });

  render();
</script>
</body>
</html>
